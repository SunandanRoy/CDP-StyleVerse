// A5 — Return Reason Decoder. "Doesn't fit" walks a zone + direction picker (not a generic
// running-small/large question) producing a decoded {fit_driven, zone, direction} chip that
// feeds the closed-loop fit_signal log. "Changed my mind" / "Quality issue" / "Other" skip
// interception entirely (contract: interception is fit-driven only).
function selectReturnReason(reason){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec.reason = reason;
  rec.step = reason === "doesnt_fit" ? "zone" : "return-form";
  render();
}
function selectFitZone(zone){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec._pendingZone = zone;
  rec.step = "direction";
  render();
}
function selectFitDirection(direction){
  const rec = findReturnByKey(state.screenParams.returnKey);
  const p = getProduct(rec.productId);
  const brand = getBrand(p.brandId);
  const archId = activeArchetypeId();
  rec.fitDecoded = { fit_driven:true, zone: rec._pendingZone, direction: direction };
  // Closed loop: every decoded fit return counts toward size guidance, intercepted or not.
  state.fitSignalLog.push({ productId: p.id, archetypeId: archId, zone: rec._pendingZone, direction: direction, source:"d2c", ts: new Date().toISOString() });
  emitEvent("fit_signal", { productId: p.id, zone: rec._pendingZone, direction: direction });
  liveSyncAppend("fit_signal", { productId: p.id, archetypeId: archId, zone: rec._pendingZone, direction: direction, source:"d2c" });
  // Value threshold: Maison Luxe, or any line over Rs 10,000, routes to human confirmation.
  if(isAdvisorFronted(brand) || p.priceInr > 10000){
    rec.step = "human-confirm";
    rec.interceptionSkippedReason = "above_value_threshold_routed_to_human";
    render();
    return;
  }
  if(!archId){
    rec.step = "return-form";
    rec.interceptionSkippedReason = "below_confidence_threshold";
    render();
    return;
  }
  rec.step = "checking";
  render();
  setTimeout(function(){
    const sizes = p.sizes;
    const suggested = recSizeFor(p, archId);
    const available = suggested && suggested !== rec.size && (hashStr(rec.id+p.id) % 10) < 7;
    if(available){
      rec._suggestedSize = suggested;
      rec.step = "exchange-offer";
    } else {
      rec.step = "return-form";
      rec.interceptionSkippedReason = "out_of_stock";
    }
    render();
  }, 800);
}
function acknowledgeHumanConfirm(){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec.status = "requested";
  rec.resolvedType = "return";
  rec.trackingRef = "Pending advisor confirmation";
  rec.step = "return-confirm";
  render();
}
function confirmExchange(){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec.status = "exchanged";

  rec.exchangeSize = rec._suggestedSize;
  rec.step = "exchange-confirm";

  const order = state.currentPersona.orders.find(function(o){ return o.id===rec.orderId; });
  if(order) order.status = "Exchange in progress";
  liveSyncAppend("return_submitted", { returnId: rec.id, resolvedType:"exchange" });
  render();
}
function declineExchange(){

  rec.step = "return-form";
  render();
}

const ADVISOR_NAMES = SCE_SEED.advisorNames;
const CHANNEL_ICON = { chat:"&#128172;", email:"&#9993;", call:"&#128222;" };
function getOrCreateThread(p, caseId){
  if(!p.cases.length){
    p.cases.push({ id:"CASE-"+Math.floor(100+Math.random()*899), subject:"General Support", predictedGrievance:false, channelLog:[] });
  }
  if(caseId){ return p.cases.find(function(c){ return c.id===caseId; }) || p.cases[0]; }
  return p.cases[0];
}
// A6 — every reply is grounded in the persona's own orders/returns so they never repeat
// information the app already has.
function findGroundingReference(p){
  const activeReturn = (p.returns||[]).find(function(r){ return r.status === "in_progress" || r.status === "requested"; });
  if(activeReturn){
    const pr = getProduct(activeReturn.productId);
    return "I can see " + activeReturn.orderId + " — your " + (activeReturn.resolvedType==="exchange"?"exchange":"return") + " for the " + pr.name + " is currently " + activeReturn.status.replace(/_/g," ") + ". ";
  }
  const recentOrder = (p.orders||[])[0];
  if(recentOrder){
    const pr = getProduct(recentOrder.items[0].productId);
    return "I can see " + recentOrder.id + " (" + pr.name + ") is currently " + recentOrder.status + ". ";
  }
  return "";
}
function buildGroundedReply(p, brand){
  const grounding = findGroundingReference(p);
  if(brand.ai_tooling_mode === "rules_engine_only") return grounding + "If you need anything else, our team typically responds within 24 hours.";
  if(brand.ai_tooling_mode === "retrieval_only") return grounding + "Let me know if you'd like more detail — happy to pull the verified data sheet.";
  return grounding + "Thanks for the message — let us know if there's anything specific we can check.";
}
async function askSupportGemini(question, p, brand){
  const grounding = findGroundingReference(p);
  const prompt = "Brand tone: " + brand.tagline + ". Customer context: " + grounding + "A customer support message: '" + question
    + "'. Reply in ONE short, helpful, grounded sentence (under 30 words) referencing the order/return context above where relevant. Do not invent order IDs or statuses not given.";
  const result = await callGemini(prompt);
  if(result.ok) return { text: result.text, isFallback:false };
  return { text: buildGroundedReply(p, brand), isFallback:true };
}
function sendSupportMessage(){
  const input = document.getElementById("support-input");
  const text = input ? input.value.trim() : "";
  if(!text) return;
  const p = state.currentPersona;
  const brand = getBrand(p.brandId);
  const thread = getOrCreateThread(p, state.screenParams.activeCaseId);
  thread.channelLog.push({ from:"customer", channel:"chat", text:text, ts:new Date().toISOString() });
  state.screenParams.typing = true;
  render();
  if(brand.client_facing_generative && !state.screenParams.escalated){
    askSupportGemini(text, p, brand).then(function(result){
      thread.channelLog.push({ from:"system", channel:"chat", text:result.text, isFallback:result.isFallback, ts:new Date().toISOString() });
      state.screenParams.typing = false;
      render();
    });
  } else {
    setTimeout(function(){
      const from = state.screenParams.escalated ? "agent" : "system";
      thread.channelLog.push({ from:from, channel:"chat", text: buildGroundedReply(p, brand), ts:new Date().toISOString() });
      state.screenParams.typing = false;
      render();
    }, 1000);
  }
}

  if(action === "calc-d2c-rate"){ state.screenParams.calcD2cRate = Number(el.value); render(); }
  if(action === "calc-mkt-rate"){ state.screenParams.calcMktRate = Number(el.value); render(); }
  if(action === "calc-split"){ state.screenParams.calcSplit = Number(el.value); render(); }
}
function handleAppChange(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  switch(action){
    case "browse-brand-select": browseBrand(el.value); break;
    case "filter-category": setFilter("category", el.value); break;
    case "filter-confidence": setFilter("confidence", el.value); break;
    case "filter-price": setFilter("price", el.value); break;
    case "cart-size": cartLineChangeSize(parseInt(el.getAttribute("data-idx"),10), el.value); break;
    case "addr-field": editAddressField(el.getAttribute("data-field"), el.value); break;
    case "consent-toggle": onboardSetConsent(el.getAttribute("data-val"), el.checked); break;
    default: break;
  }
}
function handleAppKeypress(e){
  if(e.key !== "Enter") return;
  if(e.target.id === "support-input"){ sendSupportMessage(); }
  if(e.target.id === "advisor-input"){ submitAdvisorQuestion(); }
  if(e.target.id === "claim-order-input"){ submitClaimOrderId(); }
  if(e.target.id === "claim-otp-input"){ submitClaimOtp(); }
}
// B9/B15 fix: the modal is closable by Esc as well as its close button and overlay click,
// and every role="button" data-action element activates on Enter/Space like a real button.
function handleAppKeydown(e){
  if(e.key === "Escape" && state.claimModal){ closeClaimModal(); return; }
  if(e.key === "Enter" || e.key === " " || e.key === "Spacebar"){
    const el = e.target && e.target.closest && e.target.closest('[data-action][role="button"]');
    if(el){ e.preventDefault(); el.click(); }
  }
}

// A9: inbound deep link from the Enterprise Console — ?persona=p1 or #persona=p1 skips the
// persona-select screen and opens that persona's home directly.
function deepLinkPersonaId(){
  const fromQuery = new URLSearchParams(window.location.search).get("persona");
  if(fromQuery) return fromQuery;
  const hashMatch = window.location.hash.match(/persona=([\w-]+)/);
  return hashMatch ? hashMatch[1] : null;
}
function initApp(){
  const app = document.getElementById("app");
  app.addEventListener("click", handleAppClick);
  app.addEventListener("change", handleAppChange);
  app.addEventListener("keypress", handleAppKeypress);
  app.addEventListener("input", handleAppInput);
  document.addEventListener("keydown", handleAppKeydown);
  preflightImageCheck();
  const deepLinkId = deepLinkPersonaId();
  if(deepLinkId && getPersonaTemplate(deepLinkId)){
    selectPersona(deepLinkId);
  } else {
    render();
  }
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", initApp);
} else {
  initApp();
}

// A8 — Impact dashboard calculators (reviewer area, not shown to shoppers).
function renderFunnelCalculator(sp){
  const viewToCart = sp.calcViewToCart || 22;
  const sessions = FUNNEL_DATA[0].volumeNum, views = FUNNEL_DATA[1].volumeNum;
  const carts = Math.round(views * (viewToCart/100));
  const checkouts = Math.round(carts * 0.57);
  const orders = Math.round(checkouts * 0.42);
  const endToEnd = (orders / sessions) * 100;
  const required = 2.875;
  return '<div class="card" style="padding:18px; margin-bottom:20px;">'
    + '<strong style="font-size:13px;">Funnel calculator — product-view &rarr; cart rate</strong>'
    + '<div style="margin-top:10px;"><input type="range" min="19" max="25" step="0.5" value="'+viewToCart+'" id="calc-view-to-cart" data-action="calc-view-to-cart" style="width:100%;"><div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted);"><span>19%</span><span style="font-weight:700; color:var(--text);">'+viewToCart+'%</span><span>25%</span></div></div>'
    + '<div class="stats-strip" style="margin-top:14px;">'
    +   '<div class="card stat-tile"><div class="stat-value">'+carts.toLocaleString("en-IN")+'</div><div class="stat-label">Carts</div></div>'
    +   '<div class="card stat-tile"><div class="stat-value">'+checkouts.toLocaleString("en-IN")+'</div><div class="stat-label">Checkouts</div></div>'
    +   '<div class="card stat-tile"><div class="stat-value">'+orders.toLocaleString("en-IN")+'</div><div class="stat-label">Orders</div></div>'
    +   '<div class="card stat-tile"><div class="stat-value" style="color:'+(endToEnd>=required?"var(--green)":"var(--red)")+';">'+endToEnd.toFixed(2)+'%</div><div class="stat-label">End-to-end conversion</div></div>'
    + '</div>'
    + '<p style="font-size:11.5px; color:var(--muted); margin-top:8px;">Requirement marker: &ge;'+required+'% (the 3.2% ambition\'s minimum viable floor). '+(endToEnd>=required?"Above":"Below")+' the line at this rate.</p>'
    + '</div>';
}
function renderReturnBlendCalculator(sp){
  const d2c = sp.calcD2cRate != null ? sp.calcD2cRate : 21;
  const mkt = sp.calcMktRate != null ? sp.calcMktRate : 23.5;
  const split = sp.calcSplit != null ? sp.calcSplit : 45;
  const blended = (split/100)*d2c + (1-split/100)*mkt;
  const target = 22.4;
  return '<div class="card" style="padding:18px; margin-bottom:26px;">'
    + '<strong style="font-size:13px;">Return-rate blend calculator (SpeedStyle)</strong>'
    + '<div style="margin-top:12px;"><label style="font-size:11.5px; color:var(--muted);">D2C return rate: '+d2c+'%</label><input type="range" min="10" max="35" step="0.5" value="'+d2c+'" id="calc-d2c-rate" data-action="calc-d2c-rate" style="width:100%;"></div>'
    + '<div style="margin-top:10px;"><label style="font-size:11.5px; color:var(--muted);">Marketplace return rate: '+mkt+'%</label><input type="range" min="10" max="35" step="0.5" value="'+mkt+'" id="calc-mkt-rate" data-action="calc-mkt-rate" style="width:100%;"></div>'
    + '<div style="margin-top:10px;"><label style="font-size:11.5px; color:var(--muted);">D2C share of orders: '+split+'%</label><input type="range" min="0" max="100" step="5" value="'+split+'" id="calc-split" data-action="calc-split" style="width:100%;"></div>'
    + '<div class="stats-strip" style="margin-top:14px;">'
    +   '<div class="card stat-tile"><div class="stat-value" style="color:'+(blended<=target?"var(--green)":"var(--red)")+';">'+blended.toFixed(2)+'%</div><div class="stat-label">Blended return rate</div></div>'
    +   '<div class="card stat-tile"><div class="stat-value">'+target+'%</div><div class="stat-label">Target line (&minus;20%)</div></div>'
    + '</div>'
    + '</div>';
}

// B8 fix: this never creates a passport the user didn't complete. "Someone else" is chosen
// FIRST and only ever writes to a secondary profile; state.currentPersona.fitPassport is
// touched only when the flow is explicitly completed for "myself".
const TROUBLE_ZONES = ["shoulders","chest/bust","waist","hip","length"];
const ONBOARD_STEPS = ["consent","shopfor","tier","basic","full","loading","done"];
function estimateHeightCm(range){ return range === "petite" ? 152 : range === "tall" ? 178 : 165; }
// Nearest-centroid assignment over (height, bust, waist, hip) bands — contract §3, replacing
// the old rule-based height x fit-preference lookup table (whose Tall+Relaxed cell mapped to
// Plus/Relaxed, a 5'4"-5'9" band that contradicts "Tall").
function nearestCentroidArchetype(heightCm, bustIn, waistIn, hipIn){
  function mid(r){ return (r[0]+r[1])/2; }
  let best = ARCHETYPES[0], bestDist = Infinity;
  ARCHETYPES.forEach(function(a){
    const dh = (heightCm - mid(a.height_cm)) / 20;
    const db = (bustIn - mid(a.bust_in)) / 6;
    const dw = (waistIn - mid(a.waist_in)) / 6;
    const dhp = (hipIn - mid(a.hip_in)) / 6;
    const dist = dh*dh + db*db + dw*dw + dhp*dhp;
    if(dist < bestDist){ bestDist = dist; best = a; }
  });
  return best.id;
}
function archetypeFromBasicAnswers(sp){
  const candidates = ARCHETYPES.filter(function(a){ return a.base_apparel_size === sp.usualSize; });
  const pool = candidates.length ? candidates : ARCHETYPES;
  const targetH = estimateHeightCm(sp.heightRange);
  let best = pool[0], bestDist = Infinity;
  pool.forEach(function(a){
    const mid = (a.height_cm[0]+a.height_cm[1])/2;
    const d = Math.abs(mid - targetH);
    if(d < bestDist){ bestDist = d; best = a; }
  });
  return best.id;
}

/* ---------------------------- A4a — CLAIM MARKETPLACE ORDERS (replaces the loyalty-number bridge, B9) ---------------------------- */
// A marketplace buyer has no name, archetype or Fit Passport on the marketplace side
// (contract §9) — claiming is how an anonymous buyer_alias becomes linked to a named
// StyleVerse account, via an order ID (or a simulated package-insert QR scan) + a
// simulated phone OTP. Nothing about the alias is shown to the user before a match.
function findPoolEntryByOrderId(orderId){
  return marketplaceOrderPool.find(function(entry){
    return !entry.claimed && entry.orders.some(function(o){ return o.id.toLowerCase() === String(orderId||"").trim().toLowerCase(); });
  });
}
function findClaimablePoolEntryFor(personaId){
  return marketplaceOrderPool.find(function(entry){ return !entry.claimed && entry._claimableBy === personaId; });
}
function guessArchetypeFromSizes(items){
  const counts = {};
  items.forEach(function(it){ counts[it.size] = (counts[it.size]||0) + 1; });
  let bestSize = null, bestCount = -1;
  Object.keys(counts).forEach(function(sz){ if(counts[sz] > bestCount){ bestCount = counts[sz]; bestSize = sz; } });
  if(!bestSize || bestSize === "One Size") return ARCHETYPES[0].id;
  const apparelMatch = ARCHETYPES.find(function(a){ return a.base_apparel_size === bestSize; });
  if(apparelMatch) return apparelMatch.id;
  const footMatch = ARCHETYPES.find(function(a){ return String(a.base_footwear_uk) === bestSize; });
  return footMatch ? footMatch.id : ARCHETYPES[0].id;
}

  const p = state.currentPersona;
  const entry = findClaimablePoolEntryFor(p.id);
  if(!entry){ state.claimModal.error = "No package-insert QR found for this order."; render(); return; }
  state.claimModal.orderIdInput = entry.orders[0].id;
  state.claimModal.error = null;
  render();
}

  cm.orderIdInput = orderId;

  if(!entry){
    cm.error = "We couldn't find a marketplace order with that ID. Double-check it and try again.";
    render();

  cm.error = null;

  }
  cm.error = null;
  cm.step = "verifying";
  render();
  setTimeout(function(){
    if(!state.claimModal) return;
    completeClaim();
  }, 1200);
}
function completeClaim(){
  const cm = state.claimModal;
  const p = state.currentPersona;
  const entry = marketplaceOrderPool.find(function(e){ return e.buyer_alias === cm.matchedAlias; });
  if(entry){
    entry.claimed = true;
    p.marketplaceOrders = (p.marketplaceOrders||[]).concat(entry.orders);
    if(!p.fitPassport){
      const allItems = entry.orders.reduce(function(list,o){ return list.concat(o.items); }, []);
      p.fitPassport = {
        archetypeId: guessArchetypeFromSizes(allItems), tier:"basic", passportConfidence: 45,
        completedAt: SCE_SEED.demoToday, consent:{ use_for_sizing:true, share_with_advisors:false, include_claimed_marketplace:true },
        sourcedFromClaim: true
      };
    }
    p.loyaltyPoints = (p.loyaltyPoints||0) + 250; // Tier D, illustrative bridge incentive
    p.claimStatus = "claimed";
    p.bridgingStatus = "linked";
    emitEvent("orders_claimed", { personaId: p.id, count: entry.orders.length });
    liveSyncAppend("orders_claimed", { personaId: p.id, orderIds: entry.orders.map(function(o){ return o.id; }) });
  }
  cm.step = "success";
  cm.claimedCount = entry ? entry.orders.length : 0;
  render();
}
function renderClaimModal(){
  const cm = state.claimModal;
  const p = state.currentPersona;
  let inner = "";
  if(cm.step === "entry"){
    inner = ''
      + '<h3>Claim your marketplace orders</h3>'
      + '<p style="color:var(--muted); font-size:13px;">Bought '+escapeHtml(activeBrand().name)+' on a marketplace app? Enter an order ID to bring that history — and your sizes — into this account.</p>'
      + (cm.error ? '<p style="color:var(--red); font-size:12.5px;">'+escapeHtml(cm.error)+'</p>' : '')
      + '<div class="field"><label>Marketplace order ID</label><input type="text" id="claim-order-input" placeholder="e.g. MKT-7701" value="'+escapeHtml(cm.orderIdInput||"")+'"></div>'
      + '<button class="btn" style="width:100%" data-action="claim-submit-order">Continue</button>'
      + '<button class="btn ghost" style="width:100%; margin-top:8px;" data-action="claim-scan-qr">Scan package-insert QR instead</button>';
  } else if(cm.step === "otp"){
    inner = ''
      + '<h3>Verify it\'s you</h3>'
      + '<p style="color:var(--muted); font-size:13px;">We texted a 4-digit code to the phone on file for this order (this demo accepts any 4 digits).</p>'
      + (cm.error ? '<p style="color:var(--red); font-size:12.5px;">'+escapeHtml(cm.error)+'</p>' : '')
      + '<div class="field"><label>OTP code</label><input type="text" id="claim-otp-input" placeholder="e.g. 4821" maxlength="4"></div>'
      + '<button class="btn" style="width:100%" data-action="claim-submit-otp">Verify</button>';
  } else if(cm.step === "verifying"){
    inner = '<h3>Verifying...</h3><div class="spinner"></div><p style="text-align:center; color:var(--muted); font-size:13px;">Matching your marketplace history</p>';
  } else if(cm.step === "success"){
    inner = ''
      + '<div class="checkmark-anim">&#10003;</div>'
      + '<h3 style="text-align:center;">You\'re linked!</h3>'
      + '<div class="card" style="padding:14px; margin-top:12px; font-size:13px;">'
      +   (cm.claimedCount||0)+' marketplace order'+(cm.claimedCount===1?"":"s")+' now visible in Track Everywhere'
      +   (p.fitPassport && p.fitPassport.sourcedFromClaim ? ', and we started a Fit Passport from your purchased sizes' : '')+'. '
      +   '+250 loyalty points credited (illustrative).'
      + '</div>'
      + '<button class="btn" style="width:100%; margin-top:16px;" data-action="close-claim-modal">Done</button>';
  }
  const stepIdx = { entry:1, otp:2, verifying:2, success:3 }[cm.step] || 1;
  return ''
    + '<div class="modal-overlay" data-action="close-claim-modal">'
    +   '<div class="modal" data-action="noop" role="dialog" aria-modal="true" aria-label="Claim marketplace orders">'
    +     '<button class="close-x" data-action="close-claim-modal" aria-label="Close" style="position:absolute; top:12px; right:14px;">&times;</button>'
    +     '<div class="step-dots"><span class="'+(stepIdx>=1?"active":"")+'"></span><span class="'+(stepIdx>=2?"active":"")+'"></span><span class="'+(stepIdx>=3?"active":"")+'"></span></div>'
    +     inner
    +   '</div>'
    + '</div>';
}
</script>
</body>
</html>
