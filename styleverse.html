<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StyleVerse — D2C Fashion Storefront Prototype</title>
<style>
  :root{
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --accent-soft:#2563eb18;
    --heading-font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --body-font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --bg:#f7f7f8;
    --surface:#ffffff;
    --text:#1a1a1a;
    --muted:#6b7280;
    --border:#e5e7eb;
    --radius:10px;
    --radius-lg:16px;
    --green:#16a34a;
    --amber:#d97706;
    --red:#dc2626;
    --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-lg: 0 14px 36px rgba(15,23,42,.16);
    --glass-bg: color-mix(in srgb, var(--surface) 62%, transparent);
    --glass-bg-strong: color-mix(in srgb, var(--surface) 82%, transparent);
    --glass-border: color-mix(in srgb, var(--text) 10%, transparent);
    --glass-sheen: color-mix(in srgb, white 22%, transparent);
    --glass-blur: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body-font);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.45;
  }
  h1,h2,h3,h4{font-family:var(--heading-font); margin:0 0 .4em 0; letter-spacing:0.01em; line-height:1.2;}
  h1{font-size:30px; font-weight:800;}
  h2{font-size:21px; font-weight:700;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  img{display:block; max-width:100%;}
  .container{max-width:1180px; margin:0 auto; padding:0 20px;}
  .hidden{display:none !important;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; color:var(--accent); margin-bottom:8px;
  }
  .eyebrow::before{content:""; width:16px; height:2px; background:var(--accent); border-radius:2px;}
  .img-loading{
    background:linear-gradient(100deg, var(--bg) 28%, color-mix(in srgb, var(--bg) 45%, white) 50%, var(--bg) 72%);
    background-size:200% 100%; animation:imgShimmer 1.3s ease-in-out infinite;
  }
  @keyframes imgShimmer{0%{background-position:180% 0;}100%{background-position:-20% 0;}}
  ::selection{background:var(--accent); color:#fff;}
  *:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* ---------- Liquid glass utility ---------- */
  .glass{
    background:var(--glass-bg);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    position:relative;
  }
  .glass::before{
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(115deg, var(--glass-sheen) 0%, transparent 32%, transparent 68%, var(--glass-sheen) 100%);
    opacity:.5; mix-blend-mode:overlay;
  }
  @supports not (backdrop-filter: blur(1px)){
    .glass{background:var(--glass-bg-strong);}
    .glass::before{display:none;}
  }

  /* ---------- Top Nav ---------- */
  #topnav{
    position:sticky; top:0; z-index:50;
    background:var(--glass-bg-strong);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    border-bottom:1px solid var(--glass-border);
    box-shadow:var(--shadow-sm);
  }
  @supports not (backdrop-filter: blur(1px)){
    #topnav{background:var(--surface);}
  }
  #topnav .bar{
    display:flex; align-items:center; justify-content:space-between;
    max-width:1180px; margin:0 auto; padding:13px 20px; gap:16px;
    flex-wrap:wrap; row-gap:10px;
  }
  #topnav .brand-mark{display:flex; align-items:center; gap:9px; font-family:var(--heading-font); font-weight:800; font-size:19px; cursor:pointer; letter-spacing:-.01em;}
  #topnav .brand-dot{width:13px; height:13px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent-dark)); box-shadow:0 0 0 4px var(--accent-soft);}
  #topnav nav{display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
  #topnav nav button.navlink{
    background:none; border:none; color:var(--muted); font-size:13.5px; font-weight:600; padding:8px 11px;
    border-radius:7px; transition:background .12s ease, color .12s ease;
  }
  #topnav nav button.navlink:hover{background:var(--accent-soft); color:var(--text);}
  #topnav .cart-count{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fff; border-radius:50%; min-width:17px; height:17px;
    font-size:10.5px; padding:0 4px; margin-left:5px; font-weight:700;
  }
  #topnav .cart-count.bump{animation:cartBump .42s cubic-bezier(.34,1.56,.64,1);}
  @keyframes cartBump{0%{transform:scale(1);}45%{transform:scale(1.5);}100%{transform:scale(1);}}
  #topnav .switch-persona{font-size:12.5px; color:var(--muted); background:none; border:1px solid var(--border); border-radius:20px; padding:7px 13px; font-weight:600; white-space:nowrap;}
  #topnav .switch-persona:hover{border-color:var(--accent); color:var(--accent);}
  .hamburger-btn{display:none; background:none; border:1px solid var(--border); border-radius:8px; font-size:18px; color:var(--text); padding:6px 11px; margin-left:auto;}
  @media (max-width:860px){
    .hamburger-btn{display:block;}
    #topnav .bar{flex-wrap:nowrap;}
    #topnav nav{
      display:none; position:absolute; top:100%; left:0; right:0; flex-direction:column; align-items:stretch; gap:0;
      background:var(--glass-bg-strong); backdrop-filter:blur(var(--glass-blur)) saturate(180%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
      border-bottom:1px solid var(--glass-border); box-shadow:var(--shadow-lg); padding:6px 20px 14px 20px; max-height:75vh; overflow-y:auto;
    }
    #topnav nav.nav-open{display:flex;}
    #topnav nav button.navlink{text-align:left; padding:13px 4px; border-bottom:1px solid var(--border); border-radius:0; width:100%;}
    #topnav .escalation-pill{margin-top:10px; justify-content:center;}
  }
  .escalation-pill{
    background:var(--glass-bg); backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
    border:1px solid var(--accent); color:var(--accent); border-radius:20px;
    padding:5px 12px; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:6px;
    white-space:nowrap; transition:background .15s ease, transform .1s ease;
  }
  .escalation-pill:hover{background:var(--accent-soft); transform:translateY(-1px);}
  .escalation-pill:active{transform:translateY(0);}
  @supports not (backdrop-filter: blur(1px)){ .escalation-pill{background:#fff;} }

  /* ---------- Screen transition ---------- */
  .screen-anim{animation:screenIn .32s cubic-bezier(.2,.8,.2,1);}
  @keyframes screenIn{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  /* ---------- Generic layout ---------- */
  .page{padding:32px 0 64px 0;}
  .section-title{font-size:22px; margin-bottom:14px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm); transition:box-shadow .15s ease;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:#fff; border:none; border-radius:9px;
    padding:11px 19px; font-size:14px; font-weight:700; transition:transform .1s ease, opacity .15s ease, box-shadow .15s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .btn:hover{opacity:.92; box-shadow:0 4px 14px rgba(0,0,0,.14);}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:transparent; color:var(--accent); border:1.5px solid var(--accent); box-shadow:none;}
  .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border); box-shadow:none;}
  .btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none;}
  .btn.small{padding:7px 13px; font-size:12.5px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:800; letter-spacing:.01em;}
  .badge.high{background:#dcfce7; color:#166534;}
  .badge.medium{background:#fef3c7; color:#92400e;}
  .badge.low{background:#fee2e2; color:#991b1b;}
  .badge.ai{background:#ede9fe; color:#5b21b6;}
  .pill{background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:4px 10px; font-size:12px;}

  /* ---------- Home hero ---------- */
  .hero{
    border-radius:var(--radius-lg); padding:40px 36px; margin-bottom:28px; position:relative; overflow:hidden;
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); color:#fff;
  }
  .hero::after{
    content:""; position:absolute; right:-60px; top:-60px; width:260px; height:260px; border-radius:50%;
    background:rgba(255,255,255,.08);
  }
  .hero::before{
    content:""; position:absolute; left:30%; bottom:-90px; width:220px; height:220px; border-radius:50%;
    background:rgba(255,255,255,.06);
  }
  .hero h1{color:#fff; font-size:32px; margin-bottom:8px; position:relative;}
  .hero p{color:rgba(255,255,255,.85); font-size:14.5px; max-width:520px; position:relative;}
  .hero .hero-meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; position:relative;}
  .hero .hero-meta span{background:rgba(255,255,255,.16); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;}
  .stats-strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:28px;}
  .stat-tile{padding:16px 18px;}
  .stat-tile .stat-value{font-size:24px; font-weight:800; font-family:var(--heading-font);}
  .stat-tile .stat-label{font-size:11.5px; color:var(--muted); margin-top:2px;}

  /* ---------- Persona Selector (prototype preview gate) ---------- */
  #persona-screen{min-height:100vh; background:radial-gradient(1100px 560px at 50% -8%, #2a2015, #120f0c 62%); padding:64px 20px 56px 20px;}
  .ps-header{text-align:center; color:#fff; margin-bottom:34px;}
  .ps-header .ps-kicker{
    display:inline-block; color:#e8c893; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    margin-bottom:16px; padding:5px 14px; border:1px solid rgba(232,200,147,.35); border-radius:20px;
  }
  .ps-header h1{
    font-size:46px; color:#fff; font-family:Georgia,"Times New Roman",serif; font-weight:700; letter-spacing:.01em;
    background:linear-gradient(90deg,#fff,#e8c893); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .ps-header .ps-lede{color:#e5e0d8; font-size:17px; max-width:520px; margin:10px auto 0 auto; line-height:1.5;}
  .house-strip{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:26px;}
  .house-chip{
    display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600; color:#e5e0d8;
  }
  .house-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .ps-subhead{max-width:1180px; margin:0 auto 22px auto; padding:0 4px;}
  .ps-subhead h2{color:#fff; font-size:19px; margin-bottom:4px;}
  .ps-subhead p{color:#a89e8f; font-size:13.5px; max-width:560px; margin:0;}
  .persona-grid{
    max-width:1180px; margin:0 auto; display:grid; gap:18px;
    grid-template-columns:repeat(auto-fill, minmax(270px,1fr));
  }
  .persona-card{
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-radius:16px; padding:22px; cursor:pointer; position:relative; overflow:hidden;
    border:1px solid rgba(255,255,255,.5); transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, background .18s ease;
    opacity:0; animation:cardRise .45s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .persona-card::after{
    content:""; position:absolute; inset:0; pointer-events:none; border-radius:inherit;
    background:linear-gradient(120deg, rgba(255,255,255,.55) 0%, transparent 28%, transparent 72%, rgba(255,255,255,.35) 100%);
  }
  @supports not (backdrop-filter: blur(1px)){ .persona-card{background:#fff;} }
  @keyframes cardRise{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:translateY(0);}}
  .persona-grid .persona-card:nth-child(1){animation-delay:.02s;} .persona-grid .persona-card:nth-child(2){animation-delay:.06s;}
  .persona-grid .persona-card:nth-child(3){animation-delay:.10s;} .persona-grid .persona-card:nth-child(4){animation-delay:.14s;}
  .persona-grid .persona-card:nth-child(5){animation-delay:.18s;} .persona-grid .persona-card:nth-child(6){animation-delay:.22s;}
  .persona-grid .persona-card:nth-child(7){animation-delay:.26s;} .persona-grid .persona-card:nth-child(8){animation-delay:.30s;}
  .persona-grid .persona-card:nth-child(9){animation-delay:.34s;} .persona-grid .persona-card:nth-child(10){animation-delay:.38s;}
  .persona-card:hover{transform:translateY(-6px); box-shadow:0 24px 44px rgba(0,0,0,.45); background:rgba(255,255,255,.97);}
  .persona-card .persona-icon{
    width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:19px; margin-bottom:12px; background:var(--bg); position:relative;
  }
  .persona-card .brand-badge{
    display:inline-block; color:#fff; font-size:10.5px; font-weight:800; padding:4px 10px;
    border-radius:20px; margin-bottom:10px; letter-spacing:.04em; position:absolute; top:22px; right:22px;
  }
  .persona-card .preview-tag{
    display:inline-block; font-size:9.5px; font-weight:700; color:var(--muted); letter-spacing:.03em;
    text-transform:uppercase; margin-bottom:6px;
  }
  .persona-card h3{font-size:16.5px; margin-bottom:6px; padding-right:70px;}
  .persona-card p{font-size:12.8px; color:var(--muted); line-height:1.45; margin:0;}

  /* ---------- Banners ---------- */
  .banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:#eef2ff; border:1px solid #c7d2fe; border-radius:10px; padding:14px 18px; margin-bottom:20px; flex-wrap:wrap;
  }
  .banner.outreach{background:#fff7ed; border-color:#fed7aa;}
  .banner p{margin:0; font-size:13.5px;}
  .banner .close-x{background:none; border:none; color:var(--muted); font-size:16px; padding:0 4px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.42);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index:200; padding:20px; animation:overlayIn .2s ease;
  }
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--glass-bg-strong);
    backdrop-filter:blur(var(--glass-blur)) saturate(180%); -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);
    border:1px solid var(--glass-border); border-radius:18px; padding:28px; max-width:440px; width:100%;
    box-shadow:var(--shadow-lg); position:relative; overflow:hidden; animation:modalIn .25s cubic-bezier(.2,.8,.2,1);
  }
  .modal::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg, var(--glass-sheen) 0%, transparent 30%, transparent 70%, var(--glass-sheen) 100%);
    opacity:.5; mix-blend-mode:overlay;
  }
  @keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.98);}to{opacity:1; transform:translateY(0) scale(1);}}
  @supports not (backdrop-filter: blur(1px)){ .modal{background:var(--surface);} }
  .modal h3{margin-bottom:6px;}
  .modal .step-dots{display:flex; gap:6px; margin-bottom:18px;}
  .modal .step-dots span{width:26px; height:4px; border-radius:2px; background:var(--border);}
  .modal .step-dots span.active{background:var(--accent);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px;}
  .field input{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:var(--surface); color:var(--text);}
  .addr-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  .addr-grid .field{margin-bottom:12px;}
  @media (max-width:480px){.addr-grid{grid-template-columns:1fr;}}
  .spinner{
    width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%;
    animation:spin .8s linear infinite; margin:18px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .checkmark-anim{
    width:60px; height:60px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center;
    justify-content:center; font-size:30px; margin:6px auto 14px auto; animation:pop .35s ease;
  }
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}

  /* ---------- Onboarding ---------- */
  .progress-steps{display:flex; gap:6px; margin-bottom:22px;}
  .progress-steps div{flex:1; height:5px; border-radius:3px; background:var(--border);}
  .progress-steps div.done{background:var(--accent);}
  .choice-row{display:flex; gap:12px; flex-wrap:wrap; margin:16px 0;}
  .choice-card{
    border:1.5px solid var(--border); border-radius:10px; padding:16px 20px; cursor:pointer; min-width:120px;
    text-align:center; background:#fff; transition:border-color .12s ease, background .12s ease;
  }
  .choice-card:hover{border-color:var(--accent);}
  .choice-card.selected{border-color:var(--accent); background:#eff6ff;}

  /* ---------- Catalog ---------- */
  .empty-state{text-align:center; padding:60px 20px; border:1.5px dashed var(--border); border-radius:14px;}
  .empty-state-icon{font-size:40px; opacity:.35; margin-bottom:14px;}
  .empty-state p{color:var(--muted); font-size:14px; max-width:340px; margin:0 auto 18px auto;}
  .search-row{position:relative; margin-bottom:14px;}
  .search-row input{
    width:100%; padding:12px 40px; border:1.5px solid var(--border); border-radius:10px; font-size:14px;
    background:var(--surface); color:var(--text);
  }
  .search-row input:focus{border-color:var(--accent);}
  .search-icon{position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.5; pointer-events:none;}
  .search-clear{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; font-size:18px; color:var(--muted); padding:4px 6px;}
  .filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; align-items:center; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:12px;}
  .filter-bar select{padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:#fff;}
  .filter-bar .price-filter{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);}
  .filter-bar .price-filter input[type=range]{width:120px; accent-color:var(--accent);}
  .filter-bar .result-count{margin-left:auto; font-size:12px; color:var(--muted);}
  .product-grid{display:grid; gap:22px; grid-template-columns:repeat(auto-fill, minmax(220px,1fr));}
  .product-card{overflow:hidden; cursor:pointer; transition:box-shadow .18s ease, transform .18s ease;}
  .product-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-3px);}
  .product-card .thumb-wrap{position:relative; overflow:hidden;}
  .product-card .thumb{width:100%; aspect-ratio:3/4; object-fit:cover; background:#f1f1f1; transition:transform .35s ease;}
  .product-card:hover .thumb{transform:scale(1.06);}
  .product-card .thumb-wrap .badge{position:absolute; top:10px; right:10px; box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .wish-btn{
    position:absolute; top:9px; left:9px; width:30px; height:30px; border-radius:50%; border:none;
    background:rgba(255,255,255,.92); color:#dc2626; font-size:15px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15); transition:transform .12s cubic-bezier(.34,1.56,.64,1);
  }
  .wish-btn:hover{transform:scale(1.1);}
  .wish-btn.active{animation:wishPop .3s cubic-bezier(.34,1.56,.64,1);}
  @keyframes wishPop{0%{transform:scale(1);}45%{transform:scale(1.35);}100%{transform:scale(1);}}
  .pd-wish-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; width:44px; height:44px; border-radius:9px;
    border:1px solid var(--border); background:var(--surface); color:#dc2626; font-size:17px; flex-shrink:0;
  }
  .pd-wish-btn.active{border-color:#dc2626; background:#fee2e2;}
  .product-card .pc-body{padding:13px 15px;}
  .product-card h4{font-size:14px; margin-bottom:4px; font-weight:700;}
  .product-card .price{font-size:14.5px; font-weight:800; margin-bottom:2px;}
  .product-card .pc-cat{font-size:11px; color:var(--muted); margin-bottom:8px;}

  /* ---------- Product Detail ---------- */
  .pd-grid{display:grid; grid-template-columns:1fr 1fr; gap:36px;}
  @media (max-width:840px){.pd-grid{grid-template-columns:1fr;}}
  .pd-images{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .pd-images img{width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:#f1f1f1;}
  .breadcrumb{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; font-size:12.5px;}
  .breadcrumb button{background:none; border:none; color:var(--muted); padding:0; font-size:12.5px;}
  .breadcrumb button:hover{color:var(--accent); text-decoration:underline;}
  .breadcrumb span{color:var(--border);}
  .breadcrumb .breadcrumb-current{color:var(--text); font-weight:600;}
  .confidence-row{display:flex; align-items:center; gap:16px; margin-top:16px;}
  .confidence-ring-wrap{flex-shrink:0; filter:drop-shadow(0 2px 6px rgba(0,0,0,.08));}
  .confidence-copy p{font-size:12.5px; color:var(--muted); margin:6px 0 0 0; line-height:1.4; max-width:280px;}
  .size-row{display:flex; gap:8px; margin:10px 0 18px 0; flex-wrap:wrap;}
  .size-btn{border:1.5px solid var(--border); background:#fff; border-radius:8px; padding:8px 14px; font-size:13px;}
  .size-btn.active{border-color:var(--accent); background:var(--accent); color:#fff;}
  .size-btn.recommended::after{content:"★ suggested"; display:block; font-size:9px; margin-top:2px; font-weight:600;}
  .qty-row{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .qty-row button{width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:#fff;}

  .advisor-widget{border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:22px;}
  .advisor-widget input[type=text]{width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; margin-top:8px;}
  .ai-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:#5b21b6; background:#ede9fe; padding:2px 8px; border-radius:12px;}
  .typing-dots span{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--muted); margin-right:3px; animation:blink 1.2s infinite;}
  .typing-dots span:nth-child(2){animation-delay:.2s;} .typing-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

  /* ---------- Fit Model ---------- */
  .fit-model-wrap{
    border:1px solid var(--border); border-radius:16px; padding:16px; position:relative; overflow:hidden;
    background:radial-gradient(120% 140% at 30% 0%, color-mix(in srgb, var(--accent) 7%, var(--bg)) 0%, var(--bg) 55%);
  }
  .fit-model-wrap.compact{padding:10px;}
  .fit-model-wrap.compact .fm-stage{max-width:150px;}
  .fit-model-wrap.compact .fm-hint{display:none;}
  .fit-model-wrap.compact .fm-controls button{font-size:11px;}
  .fit-model-wrap.compact .fm-controls button:not(.wide){width:26px; height:26px;}
  .fit-model-wrap.compact .fm-controls button.wide{padding:0 9px; height:26px;}
  .ai-watermark{
    position:absolute; top:10px; left:10px; font-size:9.5px; z-index:5; color:var(--muted);
    background:var(--glass-bg-strong); backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
    border:1px solid var(--glass-border); padding:3px 9px; border-radius:10px;
  }
  @supports not (backdrop-filter: blur(1px)){ .ai-watermark{background:rgba(255,255,255,.9);} }
  .fm-stage{width:100%; max-width:260px; margin:0 auto; touch-action:pan-y; user-select:none; -webkit-user-select:none; overflow:visible; cursor:grab;}
  .fm-stage:active{cursor:grabbing;}
  .fm-zoomwrap{transition:transform .15s ease; transform-origin:center top;}
  .fm-svg-holder{transition:transform .28s cubic-bezier(.4,0,.2,1);}
  .fm-svg-holder.flip{transform:scaleX(0.02);}
  .fm-marker{cursor:pointer;}
  .fm-marker circle{stroke:#fff; stroke-width:2;}
  .fm-marker .fm-pulse{animation:markerPulse 2.2s ease-out infinite; transform-origin:center; transform-box:fill-box;}
  @keyframes markerPulse{0%{opacity:.5; transform:scale(1);}70%{opacity:0; transform:scale(2.6);}100%{opacity:0; transform:scale(2.6);}}
  .fm-controls{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .fm-controls button{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--glass-border); font-size:14px; color:var(--text);
    background:var(--glass-bg-strong); backdrop-filter:blur(var(--glass-blur)); -webkit-backdrop-filter:blur(var(--glass-blur));
    box-shadow:var(--shadow-sm); transition:transform .12s ease, box-shadow .12s ease;
  }
  .fm-controls button:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
  .fm-controls button:active{transform:translateY(0) scale(.94);}
  @supports not (backdrop-filter: blur(1px)){ .fm-controls button{background:#fff;} }
  .fm-controls button.wide{width:auto; border-radius:16px; padding:0 12px; font-size:12px;}
  .fm-controls button.active-toggle{background:var(--accent); color:#fff; border-color:var(--accent);}
  .fm-tooltip{
    position:absolute; background:color-mix(in srgb, #0b1220 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:#fff; font-size:11.5px; padding:8px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.12);
    max-width:190px; z-index:20; box-shadow:var(--shadow-lg); pointer-events:none; animation:tipIn .15s ease;
  }
  @keyframes tipIn{from{opacity:0; transform:translateY(4px);}to{opacity:1; transform:translateY(0);}}
  .fm-hint{text-align:center; font-size:11px; color:var(--muted); margin-top:6px;}
  .fm-empty{padding:20px; text-align:center; color:var(--muted); font-size:13px; border:1px dashed var(--border); border-radius:10px;}

  /* ---------- Cart ---------- */
  .cart-line{display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--border);}
  .cart-line img{width:64px; height:80px; object-fit:cover; border-radius:8px; background:#f1f1f1;}
  .cart-line .cl-info{flex:1;}
  .cart-line .cl-actions{display:flex; gap:8px; align-items:center;}
  .cart-summary{display:flex; justify-content:space-between; padding:14px 0; font-weight:700;}

  .interstitial{position:fixed; inset:0; background:#fff; z-index:300; overflow-y:auto;}
  .interstitial-inner{max-width:480px; margin:0 auto; padding:60px 20px; text-align:center;}
  .interstitial-inner img{width:140px; height:170px; object-fit:cover; border-radius:10px; margin:0 auto 18px auto;}

  /* ---------- Track Everywhere ---------- */
  .order-row{padding:16px; margin-bottom:12px; cursor:pointer;}
  .order-row .or-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .channel-tag{font-size:10.5px; padding:2px 9px; border-radius:10px; font-weight:700;}
  .channel-tag.d2c{background:#dbeafe; color:#1e40af;}
  .channel-tag.marketplace{background:#fce7f3; color:#9d174d;}
  .status-badge{font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px; background:#f1f5f9; color:#334155;}
  .step-progress{display:flex; gap:4px; margin-top:12px;}
  .step-progress div{flex:1; height:4px; background:var(--border); border-radius:2px;}
  .step-progress div.done{background:var(--accent);}
  .linked-badge{background:#dcfce7; color:#166534; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; display:inline-block;}

  /* ---------- Returns ---------- */
  .reason-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:18px 0;}
  .reason-card{border:1.5px solid var(--border); border-radius:10px; padding:20px 14px; text-align:center; cursor:pointer;}
  .reason-card:hover{border-color:var(--accent);}
  .reason-card .ic{font-size:26px; margin-bottom:8px;}
  .fitq-row{display:flex; gap:14px; margin-top:16px;}
  .fitq-opt{flex:1; border:1.5px solid var(--border); border-radius:10px; padding:22px; text-align:center; cursor:pointer; font-weight:600;}
  .fitq-opt:hover{border-color:var(--accent);}

  /* ---------- Support ---------- */
  .chat-thread{display:flex; flex-direction:column; gap:12px; padding:16px 0; max-height:60vh; overflow-y:auto;}
  .msg{max-width:75%; padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.4;}
  .msg.customer{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:2px;}
  .msg.system{align-self:flex-start; background:#f1f5f9; color:var(--text); border-bottom-left-radius:2px;}
  .msg .msg-meta{font-size:10px; opacity:.75; margin-top:5px;}
  .msg .who{font-size:11px; font-weight:700; margin-bottom:3px; display:flex; align-items:center; gap:5px;}
  .avatar-circle{width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:700;}
  .chat-input-row{display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--border);}
  .chat-input-row input{flex:1; padding:11px 14px; border:1px solid var(--border); border-radius:20px; font-size:13.5px;}

  /* ---------- Account ---------- */
  .acct-grid{display:grid; gap:20px; grid-template-columns:1fr 1fr;}
  @media (max-width:840px){.acct-grid{grid-template-columns:1fr;}}
  .acct-section{padding:18px;}
  .toggle-row{display:flex; gap:8px; margin-top:8px;}
  .toggle-btn{border:1.5px solid var(--border); border-radius:20px; padding:7px 14px; font-size:12.5px; background:#fff;}
  .toggle-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  details.log-panel summary{cursor:pointer; font-weight:600; font-size:13.5px; padding:6px 0;}
  .log-entry{font-size:12.5px; padding:9px 0; border-bottom:1px solid var(--border); color:var(--muted); line-height:1.5;}
  .log-entry b{color:var(--text);}
  .profile-head{display:flex; align-items:center; gap:14px;}
  .profile-avatar{
    width:48px; height:48px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:#fff; font-weight:800; font-size:16px;
  }

  /* ---------- Toast ---------- */
  #toast-host{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
  .toast{
    pointer-events:auto; display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:12px;
    background:color-mix(in srgb, #0b1220 85%, transparent); backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,.12); color:#fff; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg);
    animation:toastIn .28s cubic-bezier(.2,.8,.2,1); max-width:90vw;
  }
  .toast.leaving{animation:toastOut .22s ease forwards;}
  @keyframes toastIn{from{opacity:0; transform:translateY(14px) scale(.96);}to{opacity:1; transform:translateY(0) scale(1);}}
  @keyframes toastOut{to{opacity:0; transform:translateY(10px) scale(.96);}}
  .toast .toast-icon{width:20px; height:20px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0;}
  .toast .toast-action{background:none; border:none; color:#93c5fd; font-weight:700; font-size:12.5px; padding:0; margin-left:4px; text-decoration:underline;}

  footer.app-footer{padding:34px 20px 26px 20px; font-size:12px; color:var(--muted); border-top:1px solid var(--border); margin-top:20px;}
  footer.app-footer .footer-inner{max-width:1180px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  footer.app-footer .footer-links{display:flex; gap:16px; flex-wrap:wrap;}
  footer.app-footer button.footer-link{background:none; border:none; color:var(--muted); font-size:12px; text-decoration:none;}
  footer.app-footer button.footer-link:hover{color:var(--text); text-decoration:underline;}
  footer.app-footer .footer-brand{font-family:var(--heading-font); font-weight:800; font-size:15px; margin-bottom:4px;}
  footer.app-footer .footer-tagline{font-size:12px; color:var(--muted); margin-bottom:16px;}
  footer.app-footer .footer-cols{display:flex; gap:40px; flex-wrap:wrap; margin-bottom:20px;}
  footer.app-footer .footer-col-title{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;}
  footer.app-footer .footer-col{display:flex; flex-direction:column; gap:7px;}
  footer.app-footer .footer-bottom{border-top:1px solid var(--border); padding-top:16px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:11.5px;}

  /* ---------- Prototype console (reviewer-only, outside the storefront) ---------- */
  #console-toggle{
    position:fixed; right:20px; bottom:20px; z-index:400;
    display:flex; align-items:center; gap:8px; padding:11px 16px 11px 13px; border-radius:26px; border:none;
    background:#0b1220; color:#e2e8f0; font-size:12.5px; font-weight:700; cursor:pointer;
    box-shadow:0 10px 26px rgba(0,0,0,.35); transition:transform .15s ease, box-shadow .15s ease;
  }
  #console-toggle:hover{transform:translateY(-2px); box-shadow:0 14px 32px rgba(0,0,0,.42);}
  #console-toggle .dot{width:8px; height:8px; border-radius:50%; background:#818cf8; box-shadow:0 0 0 3px rgba(129,140,248,.25);}
  #console-panel{
    position:fixed; right:20px; bottom:74px; z-index:401; width:328px; max-width:calc(100vw - 40px);
    max-height:min(78vh, 640px); overflow-y:auto;
    background:color-mix(in srgb, #0b1220 92%, transparent);
    backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,.1); border-radius:16px; color:#e2e8f0;
    box-shadow:0 24px 60px rgba(0,0,0,.5); animation:consoleIn .22s cubic-bezier(.2,.8,.2,1);
  }
  @supports not (backdrop-filter: blur(1px)){ #console-panel{background:#0b1220;} }
  @keyframes consoleIn{from{opacity:0; transform:translateY(10px) scale(.97);}to{opacity:1; transform:translateY(0) scale(1);}}
  #console-panel .cp-head{padding:16px 18px 12px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
  #console-panel .cp-head .cp-eyebrow{font-size:10px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:#818cf8;}
  #console-panel .cp-head h4{margin:4px 0 2px 0; font-size:14.5px; color:#fff;}
  #console-panel .cp-head p{margin:0; font-size:11.5px; color:#94a3b8; line-height:1.4;}
  #console-panel .cp-close{position:absolute; top:14px; right:14px; background:none; border:none; color:#94a3b8; font-size:16px; padding:4px;}
  #console-panel .cp-section{padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.06);}
  #console-panel .cp-section:last-child{border-bottom:none;}
  #console-panel .cp-label{font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#64748b; margin-bottom:8px;}
  #console-panel .cp-persona{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  #console-panel .cp-persona strong{font-size:13px; color:#fff; display:block;}
  #console-panel .cp-persona span{font-size:11px; color:#94a3b8;}
  #console-panel input[type=text]{
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06); color:#fff; font-size:12.5px; margin-bottom:8px;
  }
  #console-panel input[type=text]::placeholder{color:#64748b;}
  #console-panel .cp-btn{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); color:#fff; border-radius:8px;
    padding:8px 12px; font-size:12px; font-weight:700; width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center;
  }
  #console-panel .cp-btn:hover{background:rgba(255,255,255,.16);}
  #console-panel .cp-btn.primary{background:#4f46e5; border-color:#4f46e5; text-align:center; justify-content:center;}
  #console-panel .cp-status{font-size:11px; color:#94a3b8; margin-top:6px;}
  #console-panel .cp-linklist{display:flex; flex-direction:column; gap:8px;}

  /* ---------- Brand posture dials ---------- */
  .dial-row{margin-bottom:14px;}
  .dial-row .dial-label{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;}
  .dial-row .dial-label b{font-weight:700;}
  .dial-row .dial-label span{color:var(--muted);}
  .dial-track{height:7px; border-radius:4px; background:var(--border); overflow:hidden;}
  .dial-fill{height:100%; border-radius:4px; background:linear-gradient(90deg, var(--accent), var(--accent-dark));}

  /* ---------- Impact dashboard ---------- */
  .kpi-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:28px;}
  .kpi-card{padding:16px 18px;}
  .kpi-card .kpi-feature{font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
  .kpi-card .kpi-metric{font-size:13.5px; font-weight:700; margin-bottom:6px;}
  .kpi-card .kpi-move{display:flex; align-items:baseline; gap:8px;}
  .kpi-card .kpi-move .from{font-size:13px; color:var(--muted); text-decoration:line-through;}
  .kpi-card .kpi-move .to{font-size:19px; font-weight:800; color:var(--green);}
  .kpi-card .kpi-ambition{font-size:11px; color:var(--muted); margin-top:4px;}
  .data-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .data-table th{text-align:left; padding:10px 12px; background:var(--bg); border-bottom:2px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  .data-table td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
  .data-table tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px; margin-bottom:26px;}
  .table-wrap .data-table{margin:0;}
  .funnel-bar-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .funnel-bar-row .fb-label{width:150px; font-size:12px; flex-shrink:0;}
  .funnel-bar-track{flex:1; height:22px; background:var(--bg); border-radius:6px; overflow:hidden; position:relative;}
  .funnel-bar-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-dark)); border-radius:6px;}
  .funnel-bar-row .fb-volume{width:150px; text-align:right; font-size:11.5px; font-weight:700; color:var(--text); flex-shrink:0;}
  .funnel-bar-row .fb-advance{width:110px; text-align:right; font-size:12px; font-weight:700; color:var(--muted); flex-shrink:0;}

  /* ---------- About / governance ---------- */
  .limitations-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .limitations-list li{display:flex; gap:10px; font-size:13px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:10px;}
  .limitations-list li .num{flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  .changelog-item{display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .changelog-item .ver{flex-shrink:0; width:38px; font-weight:800; color:var(--accent);}

  /* ---------- Gifting / share link ---------- */
  .share-link-box{border:1.5px dashed var(--border); border-radius:10px; padding:14px 16px; margin-top:12px; background:var(--bg);}
  .share-link-box .link-row{display:flex; gap:8px; margin-top:8px;}
  .share-link-box .link-row input{flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:7px; font-size:12px; background:#fff; color:var(--muted);}

  .reviewer-banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:#0b1220; color:#e2e8f0; border-radius:12px; padding:12px 18px; margin-bottom:26px;
  }
  .reviewer-banner p{margin:0; font-size:12.5px; color:#94a3b8;}
  .reviewer-banner strong{color:#fff;}
  .reviewer-banner .btn{background:rgba(255,255,255,.12); box-shadow:none;}
  .tab-row{display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid var(--border);}
  .tab-btn{background:none; border:none; padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>
<script>
/* =========================================================================
   STYLEVERSE — SINGLE-FILE PROTOTYPE
   ========================================================================= */

/* ---------------------------- CORE CONSTANTS ---------------------------- */
const CATEGORIES = ["Tops","Bottoms","Outerwear","Footwear","Dresses","Accessories"];

const BRANDS = [
  { id:"speedstyle", name:"SpeedStyle", posture:"Automate-heavy, Self-Directed",
    hardLimit:"Synthetic imagery labelled; no implied fit accuracy beyond product capability",
    accent:"#e8491d", accentDark:"#b3350f", headingFont:'"Arial Narrow", "Oswald", sans-serif', bodyFont:'system-ui, sans-serif',
    bg:"#141414", surface:"#1f1f1f", text:"#f5f5f5", muted:"#a3a3a3", border:"#3a3a3a", contrast:"high",
    clientFacingAI:true, escalationVisible:false,
    disclosureMode:"AI-labeled", automationLevel:90, generativeContentAllowed:true,

/* ---------------------------- HASH / DETERMINISTIC HELPERS ---------------------------- */
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hesitationPenalty(productId){
  return hashStr(productId + "::hesitation") % 101;
}

function buildFitFeedback(productId){
  const rnd = mulberry32(hashStr(productId + "::feedback"));
  const entries = [];
  const count = 14 + Math.floor(rnd()*8); // 14-21 feedback entries
  for(let i=0;i<count;i++){
    const arch = ARCHETYPES[Math.floor(rnd()*ARCHETYPES.length)];
    const kept = rnd() < (0.55 + rnd()*0.35); // mostly kept, some returned
    entries.push({ archetypeId: arch.id, kept });
  }
  return entries;
}

function socialProofKeptItRate(product, archetypeId){
  const all = product.fitFeedback;
  const forArch = all.filter(f=>f.archetypeId===archetypeId);
  const pool = forArch.length ? forArch : all;
  const kept = pool.filter(f=>f.kept).length;
  return Math.round((kept / pool.length) * 100);
}
function confidenceScore(product, archetypeId){
  if(!archetypeId){
    // no fit passport: fall back to base fit-match & overall kept-rate only
    const social = socialProofKeptItRate(product, null);
    const hp = hesitationPenalty(product.id);
    return clamp(Math.round(0.5*product.baseFitMatchPct + 0.3*social + 0.2*(100-hp)), 0, 100);
  }
  const social = socialProofKeptItRate(product, archetypeId);
  const hp = hesitationPenalty(product.id);
  const score = 0.5*product.baseFitMatchPct + 0.3*social + 0.2*(100-hp);
  return clamp(Math.round(score), 0, 100);
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function confidenceTier(score){ return score>=80 ? "high" : score>=60 ? "medium" : "low"; }
const TIER_COLOR_VAR = { high:"var(--green)", medium:"var(--amber)", low:"var(--red)" };
const TIER_COPY = {
  high:"Strong match — shoppers with your build overwhelmingly kept this.",

function renderConfidenceRing(score, size){
  size = size || 104;
  const stroke = Math.max(6, Math.round(size*0.078));
  const r = (size/2) - stroke;
  const c = 2*Math.PI*r;
  const offset = c * (1 - clamp(score,0,100)/100);
  const tier = confidenceTier(score);
  const color = TIER_COLOR_VAR[tier];
  const cx = size/2, cy = size/2;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" class="confidence-ring" role="img" aria-label="'+score+' percent fit confidence">'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="'+stroke+'"/>'
    + '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" '
    +   'stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+c.toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')">'
    +   '<animate attributeName="stroke-dashoffset" from="'+c.toFixed(2)+'" to="'+offset.toFixed(2)+'" dur=".9s" begin="0.05s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>'
    + '</circle>'
    + '<text x="'+cx+'" y="'+(cy-size*0.03)+'" text-anchor="middle" dominant-baseline="middle" font-size="'+(size*0.24)+'" font-weight="800" fill="var(--text)" font-family="var(--heading-font)">'+score+'%</text>'
    + '<text x="'+cx+'" y="'+(cy+size*0.19)+'" text-anchor="middle" dominant-baseline="middle" font-size="'+(size*0.088)+'" fill="var(--muted)" letter-spacing="0.04em" font-family="var(--body-font)">CONFIDENCE</text>'
    + '</svg>';
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function shareLinkFor(name){
  const slug = String(name).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  return "https://styleverse.example/fit/" + slug + "-" + hashStr(name).toString(36).slice(0,6);
}
function renderShareLinkBox(profileName){
  return ''
    + '<div class="share-link-box">'
    +   '<strong style="font-size:13px;">Share this fit profile</strong>'
    +   '<p style="font-size:12px; color:var(--muted); margin:4px 0 0 0;">Send this link to '+escapeHtml(profileName)+' so they can view their own Fit Preview — we never render it against your body.</p>'
    +   '<div class="link-row"><input type="text" readonly value="'+shareLinkFor(profileName)+'"><button class="btn ghost small" data-action="copy-share-link" data-link="'+shareLinkFor(profileName)+'">Copy</button></div>'
    + '</div>';
}
function fmtDate(iso){
  const dt = new Date(iso);
  if(isNaN(dt)) return iso;
  return dt.toLocaleDateString("en-IN", { day:"numeric", month:"short", year:"numeric" });
}
/* ---------------------------- TOAST NOTIFICATIONS ---------------------------- */
function showToast(message, actionLabel, actionFn){
  const host = document.getElementById("toast-host");
  if(!host) return;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<span class="toast-icon">&#10003;</span><span>' + escapeHtml(message) + '</span>';
  if(actionLabel){
    const btn = document.createElement("button");
    btn.className = "toast-action";
    btn.textContent = actionLabel;
    btn.addEventListener("click", function(){
      dismissToast(el);
      if(actionFn) actionFn();
    });
    el.appendChild(btn);
  }
  host.appendChild(el);
  setTimeout(function(){ dismissToast(el); }, 3200);
}
function copyShareLink(link){
  function fallbackCopy(){
    try{
      const ta = document.createElement("textarea");
      ta.value = link; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch(e){ /* clipboard unavailable — link is still visible in the input to copy manually */ }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
  showToast("Link copied to clipboard");
}
function dismissToast(el){
  if(!el || !el.parentNode) return;
  el.classList.add("leaving");
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 220);
}

/* ---------------------------- FIT MODEL — GEOMETRY ENGINE ---------------------------- */
/* 5-position carousel: 0=side,1=threeQuarter,2=front,3=threeQuarter,4=side */
const FM_VIEW_SEQUENCE = ["side","threeQuarter","front","threeQuarter","side"];

function fmGeom(view, arch){
  const s = arch.shoulderHW, w = arch.waistHW, h = arch.hipHW, legLen = arch.legLen;
  if(view === "front"){
    return {
      cx:100, headCx:100, headCy:52, headR:21,
      shY:88, waY:158, hiY:202,
      shL:100-s, shR:100+s, waL:100-w, waR:100+w, hiL:100-h, hiR:100+h,
      legTopY:202, legBotY:202+legLen, legGap:9,
      armTopY:88, armBotY:200, armW:15, armGapL:100-s-16, armGapR:100+s+16,
      markShoulder:[100-s*0.62, 96], markWaist:[100, 160], markHem:[100, 200],
      markLength:[100, 202+legLen*0.92]
    };
  }
  if(view === "threeQuarter"){
    const cx = 108;
    return {
      cx, headCx:cx+4, headCy:52, headR:20,
      shY:90, waY:158, hiY:204,
      shNearX:cx+s*0.95, shFarX:cx-s*0.55,
      waNearX:cx+w*0.9, waFarX:cx-w*0.5,
      hiNearX:cx+h*0.9, hiFarX:cx-h*0.5,
      legTopY:204, legBotY:204+legLen*0.97,
      nearLegX:cx+h*0.4, farLegX:cx-h*0.55, legW: s*0.34,
      farArmTopY:92, farArmBotY:150, farArmW:11,
      nearArmTopY:90, nearArmBotY:200, nearArmW:16,
      markShoulder:[cx+s*0.5, 98], markWaist:[cx, 160], markHem:[cx, 202],
      markLength:[cx, 204+legLen*0.85]
    };
  }
  // side
  const cx = 100;
  const chest = s*0.42 + w*0.22;
  const seat = h*0.5;
  return {
    cx, headCx:cx+16, headCy:52, headR:19,
    shY:90, waY:158, hiY:204,
    frontX: cx+8, chestHW:chest, seatHW:seat,
    torsoTop:86, torsoBot:204,
    legTopY:204, legBotY:204+legLen*0.98,
    legFrontX: cx+10, legBackX: cx-2, legW: seat*0.62,
    footX: cx+8,
    markShoulder:[cx+12, 98], markWaist:[cx+chest*0.5+2, 160], markHem:[cx+2, 200],
    markLength:[cx+6, 204+legLen*0.85]
  };
}

function fmHeadSvg(g){
  return '<circle cx="'+g.headCx+'" cy="'+g.headCy+'" r="'+g.headR+'" fill="none" stroke="currentColor" stroke-width="3"/>';
}

function fmBodySvg(view, arch){
  const g = fmGeom(view, arch);
  let body = fmHeadSvg(g);
  if(view === "front"){
    body += '<line x1="'+g.cx+'" y1="'+(g.headCy+g.headR)+'" x2="'+g.cx+'" y2="'+g.shY+'" stroke="currentColor" stroke-width="3"/>';
    body += '<polygon points="'+g.shL+','+g.shY+' '+g.shR+','+g.shY+' '+g.waR+','+g.waY+' '+g.hiR+','+g.hiY+' '+g.hiL+','+g.hiY+' '+g.waL+','+g.waY+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>';
    body += '<line x1="'+g.armGapL+'" y1="'+g.armTopY+'" x2="'+(g.armGapL-6)+'" y2="'+g.armBotY+'" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    body += '<line x1="'+g.armGapR+'" y1="'+g.armTopY+'" x2="'+(g.armGapR+6)+'" y2="'+g.armBotY+'" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    body += '<line x1="'+(g.hiL+4)+'" y1="'+g.legTopY+'" x2="'+(g.hiL+8)+'" y2="'+g.legBotY+'" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    body += '<line x1="'+(g.hiR-4)+'" y1="'+g.legTopY+'" x2="'+(g.hiR-8)+'" y2="'+g.legBotY+'" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    body += '<ellipse cx="'+(g.hiL+8)+'" cy="'+(g.legBotY+6)+'" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="2.5"/>';
    body += '<ellipse cx="'+(g.hiR-8)+'" cy="'+(g.legBotY+6)+'" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="2.5"/>';
  } else if(view === "threeQuarter"){
    body += '<line x1="'+g.headCx+'" y1="'+(g.headCy+g.headR)+'" x2="'+g.cx+'" y2="'+g.shY+'" stroke="currentColor" stroke-width="3"/>';
    body += '<polygon points="'+g.shFarX+','+g.shY+' '+g.shNearX+','+g.shY+' '+g.waNearX+','+g.waY+' '+g.hiNearX+','+g.hiY+' '+g.hiFarX+','+g.hiY+' '+g.waFarX+','+g.waY+'" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>';
    body += '<line x1="'+g.shFarX+'" y1="'+g.farArmTopY+'" x2="'+(g.shFarX-4)+'" y2="'+g.farArmBotY+'" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>';
    body += '<line x1="'+g.shNearX+'" y1="'+g.nearArmTopY+'" x2="'+(g.shNearX+10)+'" y2="'+g.nearArmBotY+'" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    body += '<line x1="'+g.farLegX+'" y1="'+(g.legTopY+6)+'" x2="'+(g.farLegX-2)+'" y2="'+(g.legBotY-8)+'" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>';
    body += '<line x1="'+g.nearLegX+'" y1="'+g.legTopY+'" x2="'+(g.nearLegX+6)+'" y2="'+g.legBotY+'" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    body += '<ellipse cx="'+(g.nearLegX+6)+'" cy="'+(g.legBotY+6)+'" rx="9" ry="4" fill="none" stroke="currentColor" stroke-width="2.5"/>';
  } else { // side
    body += '<line x1="'+g.headCx+'" y1="'+(g.headCy+g.headR)+'" x2="'+g.frontX+'" y2="'+g.torsoTop+'" stroke="currentColor" stroke-width="3"/>';
    body += '<path d="M '+(g.frontX-6)+' '+g.torsoTop+' Q '+(g.frontX+g.chestHW)+' '+(g.torsoTop+30)+' '+(g.frontX+g.chestHW*0.6)+' '+g.waY+' Q '+(g.frontX+g.seatHW+4)+' '+(g.torsoTop+90)+' '+(g.frontX-2)+' '+g.torsoBot+' L '+(g.frontX-16)+' '+g.torsoBot+' L '+(g.frontX-14)+' '+g.torsoTop+' Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>';
    body += '<line x1="'+(g.frontX-4)+'" y1="96" x2="'+(g.frontX-6)+'" y2="188" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>';
    body += '<line x1="'+g.legBackX+'" y1="'+(g.legTopY+4)+'" x2="'+(g.legBackX-2)+'" y2="'+(g.legBotY-6)+'" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>';
    body += '<line x1="'+g.legFrontX+'" y1="'+g.legTopY+'" x2="'+(g.legFrontX+2)+'" y2="'+g.legBotY+'" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
    body += '<ellipse cx="'+(g.footX+10)+'" cy="'+(g.legBotY+5)+'" rx="13" ry="4" fill="none" stroke="currentColor" stroke-width="2.5"/>';
  }
  return body;
}

function fmGarmentSvg(view, category, arch){
  const g = fmGeom(view, arch);
  const accentFill = "currentColor";
  if(view === "front"){
    if(category==="Tops" || category==="Outerwear" || category==="Dresses"){
      const pad = category==="Outerwear" ? 9 : 4;
      const hemY = category==="Dresses" ? g.hiY + 60 : g.waY + (category==="Outerwear"?18:6);
      const hemHW = category==="Dresses" ? (g.hiR-g.cx)+10 : (g.waR-g.cx)+pad*0.6;
      return '<polygon points="'+(g.shL-pad)+','+(g.shY-4)+' '+(g.shR+pad)+','+(g.shY-4)+' '+(g.cx+hemHW)+','+hemY+' '+(g.cx-hemHW)+','+hemY+'" fill="'+accentFill+'" opacity="0.35"/>';
    }
    if(category==="Bottoms"){
      return '<polygon points="'+(g.hiL-3)+','+(g.legTopY-2)+' '+(g.hiR+3)+','+(g.legTopY-2)+' '+(g.hiR-6)+','+(g.legBotY-14)+' '+(g.hiL+6)+','+(g.legBotY-14)+'" fill="'+accentFill+'" opacity="0.35"/>';
    }
    if(category==="Footwear"){
      return '<ellipse cx="'+(g.hiL+8)+'" cy="'+(g.legBotY+6)+'" rx="12" ry="6" fill="'+accentFill+'" opacity="0.45"/><ellipse cx="'+(g.hiR-8)+'" cy="'+(g.legBotY+6)+'" rx="12" ry="6" fill="'+accentFill+'" opacity="0.45"/>';
    }
    return '<rect x="'+(g.cx-14)+'" y="'+(g.shY-14)+'" width="28" height="8" rx="4" fill="'+accentFill+'" opacity="0.5"/>';
  }
  if(view === "threeQuarter"){
    if(category==="Tops" || category==="Outerwear" || category==="Dresses"){
      const pad = category==="Outerwear" ? 9 : 4;
      const hemY = category==="Dresses" ? g.hiY + 56 : g.waY + (category==="Outerwear"?16:6);
      return '<polygon points="'+(g.shFarX-pad*0.6)+','+(g.shY-4)+' '+(g.shNearX+pad)+','+(g.shY-4)+' '+(g.waNearX+6)+','+hemY+' '+(g.waFarX-6)+','+hemY+'" fill="'+accentFill+'" opacity="0.35"/>';
    }
    if(category==="Bottoms"){
      return '<polygon points="'+(g.hiFarX-3)+','+(g.legTopY)+' '+(g.hiNearX+4)+','+(g.legTopY)+' '+(g.nearLegX+8)+','+(g.legBotY-12)+' '+(g.farLegX-2)+','+(g.legBotY-14)+'" fill="'+accentFill+'" opacity="0.35"/>';
    }
    if(category==="Footwear"){
      return '<ellipse cx="'+(g.nearLegX+6)+'" cy="'+(g.legBotY+6)+'" rx="12" ry="6" fill="'+accentFill+'" opacity="0.45"/>';
    }
    return '<rect x="'+(g.cx-10)+'" y="'+(g.shY-14)+'" width="24" height="8" rx="4" fill="'+accentFill+'" opacity="0.5"/>';
  }
  // side
  if(category==="Tops" || category==="Outerwear" || category==="Dresses"){
    const pad = category==="Outerwear" ? 8 : 3;
    const hemY = category==="Dresses" ? g.torsoBot + 56 : g.waY + (category==="Outerwear"?14:4);
    return '<polygon points="'+(g.frontX-16-pad)+','+(g.torsoTop-2)+' '+(g.frontX+g.chestHW+pad)+','+(g.torsoTop+26)+' '+(g.frontX+2)+','+hemY+' '+(g.frontX-18)+','+hemY+'" fill="'+accentFill+'" opacity="0.35"/>';
  }
  if(category==="Bottoms"){
    return '<polygon points="'+(g.legBackX-4)+','+(g.legTopY+2)+' '+(g.legFrontX+6)+','+g.legTopY+' '+(g.legFrontX+6)+','+(g.legBotY-10)+' '+(g.legBackX-4)+','+(g.legBotY-12)+'" fill="'+accentFill+'" opacity="0.35"/>';
  }
  if(category==="Footwear"){
    return '<ellipse cx="'+(g.footX+10)+'" cy="'+(g.legBotY+5)+'" rx="14" ry="6" fill="'+accentFill+'" opacity="0.45"/>';
  }
  return '<rect x="'+(g.frontX-2)+'" y="94" width="18" height="7" rx="3.5" fill="'+accentFill+'" opacity="0.5"/>';
}

const ZONE_COLOR = { true_to_size:"#16a34a", runs_tight:"#d97706", runs_loose:"#dc2626" };
const ZONE_LABEL = {
  shoulders:{ true_to_size:"Fits true to size through the shoulders for this build.",
    runs_tight:"Runs tight through the shoulders for this build.", runs_loose:"Runs loose through the shoulders for this build." },
  waist:{ true_to_size:"Fits true to size at the waist for this build.",
    runs_tight:"Runs tight at the waist for this build.", runs_loose:"Runs loose at the waist for this build." },
  length:{ true_to_size:"Length runs true to size for this build.",
    runs_tight:"Length runs shorter than expected for this build.", runs_loose:"Length runs longer than expected for this build." }
};

function fmMarkersSvg(view, category, archetypeId){
  const arch = getArchetype(archetypeId);
  const g = fmGeom(view, arch);
  const zones = (fitMatrix[category] && fitMatrix[category][archetypeId]) || { shoulders:"true_to_size", waist:"true_to_size", length:"true_to_size" };
  const lengthIsHem = category==="Tops" || category==="Outerwear" || category==="Dresses" || category==="Accessories";
  const pts = [
    { zone:"shoulders", xy:g.markShoulder },
    { zone:"waist", xy:g.markWaist },
    { zone:"length", xy: lengthIsHem ? g.markHem : g.markLength }
  ];
  return pts.map(function(pt){
    const dir = zones[pt.zone];
    const color = ZONE_COLOR[dir];
    const note = ZONE_LABEL[pt.zone][dir];
    return '<g class="fm-marker" data-zone="'+pt.zone+'" data-note="'+escapeHtml(note)+'" transform="translate('+pt.xy[0]+','+pt.xy[1]+')">'
      + '<circle class="fm-pulse" r="7" fill="'+color+'"/>'
      + '<circle r="7" fill="'+color+'"/>'
      + '</g>';
  }).join("");
}

function fmFullSvg(view, category, archetypeId){
  const arch = getArchetype(archetypeId);
  const body = fmBodySvg(view, arch);
  const garment = category ? fmGarmentSvg(view, category, arch) : "";
  const markers = category ? fmMarkersSvg(view, category, archetypeId) : "";
  return '<svg viewBox="0 0 220 420" width="100%" style="color:var(--accent); overflow:visible;">'
    + '<g>' + body + garment + '</g>'
    + '<g>' + markers + '</g>'
    + '</svg>';
}

function initFitModel(containerId, archetypeId, category){
  const root = document.getElementById(containerId);
  if(!root) return null;
  const stage = root.querySelector('[data-role="stage"]');
  const holder = root.querySelector('[data-role="svgholder"]');
  const zoomwrap = root.querySelector('[data-role="zoomwrap"]');

  const ctrl = {
    viewIndex: 2, // start on "front"
    zoom: 1,
    archetypeId: archetypeId,
    category: category,
    autoRotateTimer: null,
    dragStartX: null,
    dragging: false
  };

  function currentView(){ return FM_VIEW_SEQUENCE[ctrl.viewIndex]; }

  function renderView(){
    holder.innerHTML = fmFullSvg(currentView(), ctrl.category, ctrl.archetypeId);
    bindMarkerTaps();
  }
  function animatedStep(delta){
    ctrl.viewIndex = (ctrl.viewIndex + delta + FM_VIEW_SEQUENCE.length) % FM_VIEW_SEQUENCE.length;
    holder.classList.add("flip");
    setTimeout(function(){
      renderView();
      holder.classList.remove("flip");
    }, 150);
  }
  function bindMarkerTaps(){
    const markers = holder.querySelectorAll(".fm-marker");
    markers.forEach(function(m){
      m.addEventListener("click", function(e){
        e.stopPropagation();
        showTooltip(m, m.getAttribute("data-note"));
      });
    });
  }
  function showTooltip(markerEl, note){
    const old = root.querySelector(".fm-tooltip");
    if(old) old.remove();
    const tip = document.createElement("div");
    tip.className = "fm-tooltip";
    tip.textContent = note;
    root.appendChild(tip);
    const rootRect = root.getBoundingClientRect();
    const markRect = markerEl.getBoundingClientRect();
    tip.style.left = Math.max(6, markRect.left - rootRect.left - 60) + "px";
    tip.style.top = Math.max(6, markRect.top - rootRect.top - 46) + "px";
    setTimeout(function(){ if(tip.parentNode) tip.remove(); }, 3200);
  }

  // pointer / touch drag rotation
  function onDown(clientX){
    ctrl.dragging = true;
    ctrl.dragStartX = clientX;
    stage.style.cursor = "grabbing";
  }
  function onMove(clientX){
    if(!ctrl.dragging || ctrl.dragStartX===null) return;
    const dx = clientX - ctrl.dragStartX;
    if(Math.abs(dx) > 60){
      animatedStep(dx > 0 ? -1 : 1);
      ctrl.dragStartX = clientX;
    }
  }
  function onUp(){
    ctrl.dragging = false;
    ctrl.dragStartX = null;
    stage.style.cursor = "grab";
  }
  stage.addEventListener("pointerdown", function(e){ onDown(e.clientX); });
  window.addEventListener("pointermove", function(e){ onMove(e.clientX); });
  window.addEventListener("pointerup", onUp);
  stage.addEventListener("touchstart", function(e){ onDown(e.touches[0].clientX); }, { passive:true });
  stage.addEventListener("touchmove", function(e){ onMove(e.touches[0].clientX); }, { passive:true });
  stage.addEventListener("touchend", onUp);

  root.querySelector('[data-role="rotleft"]').addEventListener("click", function(){ animatedStep(-1); });
  root.querySelector('[data-role="rotright"]').addEventListener("click", function(){ animatedStep(1); });
  const autoBtn = root.querySelector('[data-role="autorotate"]');
  autoBtn.addEventListener("click", function(){
    if(ctrl.autoRotateTimer){
      clearInterval(ctrl.autoRotateTimer);
      ctrl.autoRotateTimer = null;
      autoBtn.classList.remove("active-toggle");
    } else {
      autoBtn.classList.add("active-toggle");
      ctrl.autoRotateTimer = setInterval(function(){ animatedStep(1); }, 2500);
    }
  });
  root.querySelector('[data-role="zoomin"]').addEventListener("click", function(){
    ctrl.zoom = Math.min(2, ctrl.zoom + 0.15);
    zoomwrap.style.transform = "scale(" + ctrl.zoom + ")";
  });
  root.querySelector('[data-role="zoomout"]').addEventListener("click", function(){
    ctrl.zoom = Math.max(0.6, ctrl.zoom - 0.15);
    zoomwrap.style.transform = "scale(" + ctrl.zoom + ")";
  });

  ctrl.updateProduct = function(newCategory, newArchetypeId){
    holder.style.transition = "opacity .25s ease";
    holder.style.opacity = "0";
    setTimeout(function(){
      ctrl.category = newCategory;
      if(newArchetypeId) ctrl.archetypeId = newArchetypeId;
      root.setAttribute("data-category", newCategory || "");
      root.setAttribute("data-archetype", ctrl.archetypeId);
      renderView();
      holder.style.opacity = "1";
    }, 180);
  };
  ctrl.destroy = function(){
    if(ctrl.autoRotateTimer) clearInterval(ctrl.autoRotateTimer);
  };

  bindMarkerTaps();
  state.fitModelRegistry[containerId] = ctrl;
  return ctrl;
}
function destroyAllFitModels(){
  Object.keys(state.fitModelRegistry).forEach(function(id){
    state.fitModelRegistry[id].destroy();
  });
  state.fitModelRegistry = {};
}

const GEMINI_ENDPOINT_BASE = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";
const FALLBACKS = {

function withinRateLimit(){
  const now = Date.now();
  state.apiCallLog = state.apiCallLog.filter(function(ts){ return now - ts < 60000; });
  return state.apiCallLog.length < 8;
}
function recordApiCall(){ state.apiCallLog.push(Date.now()); }

async function callGemini(prompt){
  if(!state.geminiKey){ return { ok:false, reason:"no-key" }; }
  if(!withinRateLimit()){ return { ok:false, reason:"rate-limit" }; }
  recordApiCall();
  const controller = new AbortController();
  const timer = setTimeout(function(){ controller.abort(); }, 8000);
  try{
    const res = await fetch(GEMINI_ENDPOINT_BASE + "?key=" + encodeURIComponent(state.geminiKey), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }),
      signal: controller.signal
    });
    clearTimeout(timer);
    if(res.status === 429){ return { ok:false, reason:"rate-limit" }; }
    if(!res.ok){
      const errText = await res.text().catch(function(){ return ""; });
      console.error("[StyleVerse] Gemini error", res.status, errText);
      return { ok:false, reason:"http-error" };
    }
    const data = await res.json();
    const text = data && data.candidates && data.candidates[0] && data.candidates[0].content
      && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
    if(!text){ return { ok:false, reason:"empty" }; }
    return { ok:true, text: text.trim() };
  } catch(err){
    clearTimeout(timer);
    console.error("[StyleVerse] Gemini call failed", err);
    return { ok:false, reason: err.name === "AbortError" ? "timeout" : "network" };
  }
}

async function explainFit(product, archetypeId){
  const social = socialProofKeptItRate(product, archetypeId);
  const conf = confidenceScore(product, archetypeId);
  const prompt = "Given fit-match: " + product.baseFitMatchPct + "%, social-proof kept-it rate: " + social
    + "%, in the voice of a friendly shopping assistant, write ONE short sentence (under 20 words) telling a shopper why this item is a "
    + conf + "% fit confidence match for them. No technical terms.";
  const result = await callGemini(prompt);
  if(result.ok) return { text: result.text, isFallback:false };
  return { text: FALLBACKS.explainFit, isFallback:true };
}

async function askStyleAdvisor(question, product, archetypeId){
  const social = socialProofKeptItRate(product, archetypeId);
  const prompt = "A shopper asks: '" + question + "' about a product with these fit signals: fit-match "
    + product.baseFitMatchPct + "%, kept-it rate " + social
    + "%. Answer in ONE short, helpful, conversational sentence (under 30 words), as a friendly style advisor would, using the fit data to inform the answer.";
  const result = await callGemini(prompt);
  if(result.ok) return { text: result.text, isFallback:false };
  return { text: FALLBACKS.askStyleAdvisor, isFallback:true };
}

function animateCountUps(){
  document.querySelectorAll("[data-countup]").forEach(function(el){
    const target = parseInt(el.getAttribute("data-countup"), 10) || 0;
    const start = performance.now();
    const dur = 650;
    function tick(now){
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(eased * target);
      if(t < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

const STATUS_STEPS = ["Ordered","Shipped","Out for Delivery","Delivered"];
function getTimelineOrders(p){
  const isBridged = p.bridgingStatus === "linked";
  let list = p.orders.map(function(o){ return Object.assign({}, o, { channel:"d2c" }); });
  if(isBridged){
    list = list.concat((p.marketplaceOrders||[]).map(function(o){ return Object.assign({}, o, { channel:"marketplace" }); }));
  }
  list.sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
  return list;
}
function toggleOrderExpand(orderId){
  state.screenParams.expandedOrderId = state.screenParams.expandedOrderId === orderId ? null : orderId;
  render();
}
function renderTrackScreen(){
  const p = state.currentPersona;
  const isBridged = p.bridgingStatus === "linked";
  const timeline = getTimelineOrders(p);
  const expandedId = state.screenParams.expandedOrderId;
  const rows = timeline.length ? timeline.map(function(o){
    const stepIdx = STATUS_STEPS.indexOf(o.status);
    const stepsHtml = STATUS_STEPS.map(function(s,i){ return '<div class="'+(stepIdx>=0 && i<=stepIdx ? "done":"")+'"></div>'; }).join("");
    const expanded = expandedId === o.id;
    const itemsHtml = o.items.map(function(it){
      const pr = getProduct(it.productId);
      return '<div class="cart-line"><div class="cl-info"><div style="font-weight:600; font-size:13.5px;">'+escapeHtml(pr.name)+'</div><div style="font-size:12px; color:var(--muted);">Size '+it.size+' &middot; Qty '+it.qty+'</div></div></div>';
    }).join("");
    const canReturn = o.status === "Delivered";
    return ''
      + '<div class="card order-row" data-action="toggle-order" data-id="'+o.id+'">'
      +   '<div class="or-top">'
      +     '<div><strong>'+o.id+'</strong> <span class="channel-tag '+o.channel+'">'+(o.channel==="d2c"?"via StyleVerse.com":"via Marketplace")+'</span></div>'
      +     '<span class="status-badge">'+o.status+'</span>'
      +   '</div>'
      +   '<div style="font-size:12px; color:var(--muted); margin-top:4px;">'+fmtDate(o.date)+'</div>'
      +   (STATUS_STEPS.indexOf(o.status)>=0 ? '<div class="step-progress">'+stepsHtml+'</div>' : '')
      +   (expanded ? '<div style="margin-top:14px; border-top:1px solid var(--border); padding-top:12px;">'+itemsHtml
              + (canReturn ? '<button class="btn small" style="margin-top:10px;" data-action="start-return" data-order="'+o.id+'" data-product="'+o.items[0].productId+'">Start a Return</button>' : '')
              + '</div>' : '')
      + '</div>';
  }).join("") : '<p style="color:var(--muted);">No orders yet.</p>';

    +   '<h1>Track Everywhere</h1>'

    +   rows
    + '</div>';
}

/* ---------------------------- SCREEN 10 — RETURNS & EXCHANGE ---------------------------- */
function returnKeyFor(orderId, productId){ return orderId + "::" + productId; }
function findReturnByKey(key){
  return state.currentPersona.returns.find(function(r){ return returnKeyFor(r.orderId, r.productId) === key; });
}
function startReturnFlow(orderId, productId){
  const key = returnKeyFor(orderId, productId);
  let rec = findReturnByKey(key);
  if(!rec){
    const order = state.currentPersona.orders.find(function(o){ return o.id===orderId; });
    const item = order.items.find(function(it){ return it.productId===productId; });
    rec = { id:"SV-RET-"+Math.floor(100+Math.random()*899), orderId:orderId, productId:productId, size:item.size,
      status:"in_progress", reason:null, fitIssue:null, step:"reason", resolvedType:null, exchangeSize:null, trackingRef:null, date:new Date().toISOString().slice(0,10) };
    state.currentPersona.returns.push(rec);
  }
  navigate("return-flow", { returnKey: key });
}
function resumeReturnFlow(key){ navigate("return-flow", { returnKey: key }); }
function selectReturnReason(reason){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec.reason = reason;
  rec.step = reason === "doesnt_fit" ? "fitq" : "return-form";
  render();
}
function selectFitIssue(issue){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec.fitIssue = issue;
  rec.step = "checking";
  render();
  setTimeout(function(){
    const p = getProduct(rec.productId);
    const sizes = p.sizes;
    const curIdx = sizes.indexOf(rec.size);
    const dir = issue === "running_small" ? 1 : -1;
    const targetIdx = clamp(curIdx + dir, 0, sizes.length-1);
    const available = targetIdx !== curIdx && (hashStr(rec.id+p.id) % 10) < 7;
    if(available){
      rec._suggestedSize = sizes[targetIdx];
      rec.step = "exchange-offer";
    } else {
      rec.step = "return-form";
    }
    render();
  }, 800);
}
function confirmExchange(){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec.status = "exchanged";
  rec.resolvedType = "exchange";
  rec.exchangeSize = rec._suggestedSize;
  rec.step = "exchange-confirm";
  rec.newDeliveryDate = new Date(Date.now() + 4*86400000).toISOString().slice(0,10);
  const order = state.currentPersona.orders.find(function(o){ return o.id===rec.orderId; });
  if(order) order.status = "Exchange in progress";
  render();
}
function declineExchange(){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec.step = "return-form";
  render();
}
function setPickupPref(val){ findReturnByKey(state.screenParams.returnKey).pickupPref = val; render(); }
function setRefundPref(val){ findReturnByKey(state.screenParams.returnKey).refundPref = val; render(); }
function submitReturnForm(){
  const rec = findReturnByKey(state.screenParams.returnKey);
  rec.status = "requested";
  rec.resolvedType = "return";
  rec.trackingRef = "RET-TRK-" + Math.floor(100000+Math.random()*899999);
  rec.step = "return-confirm";
  const order = state.currentPersona.orders.find(function(o){ return o.id===rec.orderId; });
  if(order) order.status = "Return in Progress";
  render();
}

const CHANNEL_ICON = { chat:"&#128172;", email:"&#9993;", call:"&#128222;" };
function getOrCreateThread(p){
  if(!p.cases.length){
    p.cases.push({ id:"CASE-"+Math.floor(100+Math.random()*899), subject:"General Support", predictedGrievance:false, channelLog:[] });
  }
  return p.cases[0];

function sendSupportMessage(){
  const input = document.getElementById("support-input");
  const text = input ? input.value.trim() : "";

  const thread = getOrCreateThread(p);
  thread.channelLog.push({ from:"customer", channel:"chat", text:text, ts:new Date().toISOString() });

  setTimeout(function(){
    thread.channelLog.push({ from:"system", channel:"chat", text:"Thanks — we'll get back to you shortly.", ts:new Date().toISOString() });

    case "start-onboarding": startFitOnboarding(); break;

    case "onboard-fit": onboardingSelectFit(val); break;
    case "onboard-shopfor": onboardingSelectShoppingFor(val); break;
    case "onboard-continue": onboardingContinueToFinish(); break;
    case "open-product": openProduct(id); break;
    case "select-size": selectSize(val); break;
    case "qty-minus": changeQty(-1); break;
    case "qty-plus": changeQty(1); break;

    case "confirm-exchange": confirmExchange(); break;

    case "pickup-pref": setPickupPref(val); break;

function handleAppInput(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  if(action === "catalog-search"){ setFilter("search", el.value); }
}
function handleAppChange(e){
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.getAttribute("data-action");
  switch(action){
    case "browse-brand-select": browseBrand(el.value); break;
    case "filter-category": setFilter("category", el.value); break;
    case "filter-confidence": setFilter("confidence", el.value); break;
    case "filter-price": setFilter("price", el.value); break;
    case "cart-size": cartLineChangeSize(parseInt(el.getAttribute("data-idx"),10), el.value); break;
    case "addr-field": editAddressField(el.getAttribute("data-field"), el.value); break;
    default: break;
  }
}
function handleAppKeypress(e){
  if(e.key !== "Enter") return;
  if(e.target.id === "support-input"){ sendSupportMessage(); }
  if(e.target.id === "advisor-input"){ submitAdvisorQuestion(); }
  if(e.target.id === "bridge-loyalty-input"){ bridgeModalVerify(); }
}

function initApp(){
  const app = document.getElementById("app");
  app.addEventListener("click", handleAppClick);
  app.addEventListener("change", handleAppChange);
  app.addEventListener("keypress", handleAppKeypress);
  app.addEventListener("input", handleAppInput);
  preflightImageCheck();
  render();
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", initApp);
} else {
  initApp();
}
